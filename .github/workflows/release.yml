name: release

# Builds + publishes the gh-runner plugin image on tag push.
# Tag format is plain semver: v0.1.0, v0.1.1, v1.0.0-rc1, etc.
#
# Single image (no variants — gh-runner is GPU-agnostic and the
# actions/runner tarball version is pinned in the Dockerfile). The
# release manifest keeps the semver image tag so SmoothNAS updates
# install the latest published plugin version.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # gh release create
  packages: write   # ghcr.io push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: wrapper tests
        working-directory: wrapper
        run: |
          go vet ./...
          go test -race ./...
      - name: image includes executable action runtimes
        run: |
          set -euo pipefail
          docker build --pull -t smoothnas-gh-runner:test .
          docker run --rm --entrypoint /bin/sh smoothnas-gh-runner:test -c 'test "$( . /etc/os-release && printf %s "$ID:$VERSION_ID" )" = debian:13'
          docker run --rm --entrypoint /home/runner/externals/node20/bin/node smoothnas-gh-runner:test --version
          docker run --rm --entrypoint /home/runner/externals/node24/bin/node smoothnas-gh-runner:test --version

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase tags ("repository name must be lowercase").
      # The org slug is `RakuenSoftware` in github.repository, so we
      # lowercase the whole reference before passing it to buildx.
      - name: Compute lowercase image ref
        id: image
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
          provenance: false

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage release manifest
        run: |
          set -euo pipefail
          mkdir -p release
          cp smoothnas-plugin.yaml release/smoothnas-plugin.yaml
          ls -l release/

      # release-please created the GitHub release with its own
      # conventional-commit-derived notes when the release PR merged.
      # We just attach the semver-tagged manifest as a release asset.
      # generate_release_notes is left at its default (false) so we
      # don't overwrite release-please's notes.
      - name: Attach manifest to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/smoothnas-plugin.yaml
