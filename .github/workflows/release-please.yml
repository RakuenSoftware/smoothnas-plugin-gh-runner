name: release-please

# Bumps the version + opens (or updates) a "Release vX.Y.Z" PR every
# time a releasable conventional commit lands on main. The
# release-signal PR check prevents ordinary PRs from merging without a
# fix:, feat:, deps:, or Release-As signal, because release-please
# otherwise exits successfully while creating no release PR. Merging
# the release PR creates the v* tag; this workflow then dispatches
# release.yml to build + publish the image and attach the manifest.
#
# Conventional-commit keywords:
#   feat:    minor bump (0.1.0 → 0.2.0)
#   fix:     patch bump (0.1.0 → 0.1.1)
#   feat!:   major bump (or any commit with BREAKING CHANGE: footer)
# Other prefixes (chore:, docs:, refactor:, test:, build:, ci:) are
# included in release notes but don't bump on their own.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Publish release assets
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$REPO" --ref "$TAG_NAME"
